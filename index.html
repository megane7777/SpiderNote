<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10141c"><title>SpiderNote</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header class="topbar">
  <a class="brand" href="#" aria-label="SpiderNote home"><span class="brand-mark">✳</span><span>Spider<span class="accent">Note</span></span></a>
  <div class="top-title" id="currentMapName">SpiderNote</div>
  <div class="save-state" id="saveState"><i></i> 保存済み</div>
  <div class="toolbar">
    <button id="undoBtn" title="元に戻す">↶</button><button id="redoBtn" title="やり直す">↷</button>
    <span class="tool-sep"></span>
    <button class="primary" id="addNodeBtn">＋ ノード</button>
    <button id="connectBtn">↗ 接続</button>
    <button id="layoutBtn">自動配置</button>
    <button id="searchBtn">⌕ 検索</button>
    <button id="exportBtn">⇧ 出力</button>
    <button id="settingsBtn">⚙ 設定</button>
    <button id="fitBtn">全体表示</button>
    <button id="miniToggle">ミニマップ</button>
  </div>
</header>
<div class="shell">
<aside class="left-panel" id="leftPanel">
  <div class="side-head"><span>ワークスペース</span><button class="icon-btn" id="newMapBtn" title="新しいマップ">＋</button></div>
  <label class="searchbox">⌕ <input id="mapSearch" placeholder="マップを検索"></label>
  <div class="side-actions"><button class="primary full" id="createMapBtn">＋ 新しいマップ</button></div>
  <div class="section-label">お気に入り</div><div id="favoriteList" class="map-list"></div>
  <div class="section-label">フォルダ <button class="text-btn" id="addFolderBtn">＋追加</button></div>
  <div id="folderList" class="folder-list"></div>
  <div class="section-label">すべてのマップ</div><div id="mapList" class="map-list"></div>
  <div class="side-bottom">
    <button id="archiveToggle">▣ アーカイブ</button>
    <button id="trashToggle">⌫ ゴミ箱</button>
    <button id="guideBtn">？ 使い方ガイド</button>
  </div>
</aside>
<main class="main-area">
  <div class="canvas-toolbar">
    <div class="crumb" id="breadcrumb">マップ / 新しいマップ</div>
    <div class="canvas-actions"><button id="selectModeBtn" class="active">選択</button><button id="connectModeBtn">接続</button><button id="zoomOut">−</button><span id="zoomText">100%</span><button id="zoomIn">＋</button></div>
  </div>
  <section class="canvas-area" id="canvasArea">
    <canvas id="graph"></canvas>
    <div class="welcome" id="welcome"><div class="welcome-icon">✳</div><h2>アイデアをつなげよう</h2><p>「＋ ノード」から最初のノードを追加できます。<br>ノードをドラッグして配置し、接続で関係を表現しましょう。</p><button class="primary" id="welcomeAdd">最初のノードを追加</button></div>
    <div class="minimap" id="minimap"><canvas id="miniCanvas"></canvas></div>
    <div class="canvas-hint">ドラッグ：ノード移動・空白移動　/　ホイール：拡大縮小　/　ダブルクリック：ノード追加</div>
  </section>
</main>
<aside class="right-panel" id="rightPanel">
  <div class="panel-tabs"><button class="tab active" data-tab="node">ノード</button><button class="tab" data-tab="map">マップ</button></div>
  <section id="nodeTab" class="tab-content">
    <div id="noNode" class="empty-panel"><div class="empty-symbol">◇</div><b>ノードを選択</b><p>キャンバス上のノードを選択すると、ここで内容を編集できます。</p></div>
    <div id="nodeEditor" hidden>
      <div class="field"><label>タイトル</label><input id="nodeTitle" maxlength="120" placeholder="ノード名"></div>
      <div class="field"><label>説明・メモ</label><textarea id="nodeDescription" rows="5" placeholder="詳しい内容を入力…"></textarea></div>
      <div class="field"><label>アイコン</label><input id="nodeIcon" maxlength="8" placeholder="例：💡"></div>
      <div class="field"><label>色</label><div class="swatches" id="swatches"></div><input type="color" id="customColor"></div>
      <div class="field two"><div><label>形</label><select id="nodeShape"><option value="round">角丸</option><option value="rect">四角</option><option value="pill">丸型</option></select></div><div><label>サイズ</label><select id="nodeSize"><option value="auto">自動</option><option value="small">小</option><option value="medium">中</option><option value="large">大</option></select></div></div>
      <div class="field two"><div><label>透明度</label><input id="nodeOpacity" type="range" min="35" max="100" value="100"></div><div><label>影</label><select id="nodeShadow"><option value="on">あり</option><option value="off">なし</option></select></div></div>
      <div class="field"><label>枠線</label><input id="nodeBorder" type="color" value="#8292ad"></div>
      <div class="field"><label>タグ（カンマ区切り）</label><input id="nodeTags" placeholder="勉強, 重要"></div>
      <div class="field"><label>ノード画像</label><img id="nodeImagePreview" hidden alt="ノード画像" style="max-width:100%;max-height:150px;border-radius:8px;margin:6px 0"><input id="nodeImageFile" type="file" accept="image/*"><button id="removeNodeImage" type="button">画像を削除</button></div>
      <div class="field"><label>接続先</label><div id="connectionInfo" class="connection-info">接続なし</div></div>
      <div class="button-row"><button id="duplicateNode">複製</button><button class="danger" id="deleteNode">削除</button></div>
      <div class="button-row"><button id="collapseNode">子ノードを折りたたむ</button></div>
    </div>
  </section>
  <section id="mapTab" class="tab-content" hidden>
    <div class="field"><label>マップ名</label><input id="editMapName"></div>
    <div class="field"><label>説明</label><textarea id="editMapDescription" rows="3"></textarea></div>
    <div class="field"><label>フォルダ</label><select id="mapFolder"></select></div>
    <div class="field"><label>レイアウト</label><select id="layoutSelect"><option value="radial">放射状</option><option value="tree">ツリー</option><option value="grid">グリッド</option><option value="force">力学配置</option></select></div>
    <div class="button-row"><button id="applyLayout">配置を実行</button><button id="duplicateMap">マップを複製</button></div>
    <div class="button-row"><button id="mapHistory">変更履歴</button><button id="linkMapBtn">マップを関連付け</button></div>
    <div class="field"><label>関連マップ</label><div id="relatedMaps" class="connection-info">関連マップなし</div></div>
    <div class="button-row"><button class="danger" id="deleteMap">ゴミ箱へ</button></div>
    <div class="button-row"><button id="favoriteMap">☆ お気に入り</button><button id="archiveMap">アーカイブ</button></div>
    <div class="field"><label>マップ内検索</label><input id="insideSearch" placeholder="タイトル・説明・タグ"></div>
    <div id="insideResults" class="search-results"></div>
    <div class="section-label">マップ情報</div><div class="map-meta" id="mapMeta"></div>
  </section>
</aside>
</div>
<footer class="statusbar"><span>SpiderNote · 自動保存</span><span id="footerStatus">ローカル保存</span></footer>
</div>
<div class="overlay" id="overlay"><div class="dialog"><div class="dialog-head"><h2 id="dialogTitle">SpiderNote</h2><button class="icon-btn" id="dialogClose">×</button></div><div id="dialogContent"></div></div></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script src="app.js"></script>
</body></html>
